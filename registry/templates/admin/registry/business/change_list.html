{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    {{ block.super }}
    <li>
        <a href="{% url 'businesses_report' %}" class="btn-generate" target="_blank">
            📄 Generiši izvještaj
        </a>
    </li>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        /* ------------------- BUTTON STYLING ------------------- */
        .btn-generate {
            background-color: #4CAF50;  /* Green */
            color: white !important;    /* White text */
            padding: 10px 12px;          /* Top/Bottom 6px, Left/Right 12px */
            border-radius: 4px;         /* Rounded corners */
            text-decoration: none;      /* Remove underline */
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .btn-generate:hover {
            background-color: #45a049;  /* Darker green on hover */
        }
    </style>
{% endblock %}
