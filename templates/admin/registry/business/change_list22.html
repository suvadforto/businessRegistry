{% extends "admin/change_list.html" %}

{% block content %}
{{ block.super }}

<div style="margin-top:40px; width:400px;">
    <h3>Statistika djelatnosti</h3>
    <canvas id="industryChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
fetch("{% url 'admin:business-stats' %}")
  .then(response => response.json())
  .then(data => {
    const ctx = document.getElementById('industryChart');

    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: data.labels,
            datasets: [{
                data: data.data
            }]
        }
    });
});
</script>

{% endblock %}
